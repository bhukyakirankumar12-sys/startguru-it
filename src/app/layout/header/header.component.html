<header
  class="header"
  [class.header--scrolled]="scrolled()"
  role="banner"
>
  <div class="header__inner sg-container">
    <div class="header__brand-area">
      <a class="brand" href="#top" (click)="closeMenu()" aria-label="StarGuru — Build. Transform. Grow.">
        <img
          class="brand__logo"
          src="/images/starguru-logo-horizontal-white-text.png"
          width="240"
          height="84"
          alt="StarGuru — Build. Transform. Grow."
          decoding="async"
          fetchpriority="high"
        />
      </a>
      <span class="header__badge" title="Minority & Women-Owned Small Business · Cumming, GA">
        <span class="header__badge-star" aria-hidden="true">★</span>
        Minority Women-Owned
      </span>
    </div>

    <button
      type="button"
      class="nav-toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-navigation"
      (click)="toggleMenu()"
      aria-label="Toggle navigation menu"
    >
      <span class="sr-only">Toggle navigation</span>
      <span class="nav-toggle__bars" aria-hidden="true"></span>
    </button>

    <nav
      id="primary-navigation"
      class="nav"
      [class.nav--open]="menuOpen()"
      aria-label="Primary"
    >
      <ul class="nav__list">
        @for (item of navItems; track item.label) {
          <li class="nav__item">
            <a class="nav__link" [href]="navLink(item)" (click)="closeMenu()">{{ item.label }}</a>
          </li>
        }
      </ul>

      <div class="header__actions">
        <a class="header__phone" href="tel:+16789954883" aria-label="Call +1 678 995 4883">
          <svg class="header__phone-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>(678) 995-4883</span>
        </a>

        <a class="btn btn--gold header__cta" href="#contact" (click)="closeMenu()">
          Consultation
          <span class="btn__chev" aria-hidden="true">→</span>
        </a>
      </div>
    </nav>
  </div>
</header>
